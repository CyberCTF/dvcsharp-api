# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Damn Vulnerable C# API (by Appsecco) as an Isoloom spec: the ASP.NET Core API, vendored
# unchanged in build/web/app/, built by its own Dockerfile (on the .NET Core 2.1 SDK, since its
# microsoft/dotnet base is gone). Its database is SQLite, inside the container.
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: dvcsharp-api

networks:
  lab: { cidr: 10.60.22.0/24, internet: false }

machines:
  api:
    networks: { lab: 10 }
    services: [{ port: 5000, name: api, http: true, publish: 5000 }]
    resources: { cpus: 1, memory_mb: 1024 }
    docker:
      build: build/web

checks:
  - name: the product API answers
    http: http://api:5000/api/products
    wait: 300
  - name: a new user registers and gets a token
    script: checks/register-token.sh
  - name: the product search is injectable
    script: checks/sqli-search.sh

message: |
  The DVCSharp API answers at http://localhost:{{ machines.api.services.0.publish }}/api/.
  Register with POST /api/registrations, get a token from POST /api/authorizations, then work
  through the endpoints; upstream's Postman collection lists them all.
